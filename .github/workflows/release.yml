name: Publish Windows prerelease

on:
  push:
    branches: [main]
    paths: [Directory.Build.props, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slx-windows-release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'Sooliks/slx-windows' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the triggering commit and release tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the repository SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Install release tooling runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.10.0'
      - name: Check release policy and exact previous tag
        id: previous
        run: |
          node --test scripts/tests/release-auth.test.mjs scripts/tests/release-base.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release policy tests failed' }
          ./scripts/tests/runtime-inputs.test.ps1
          $baseRef = node scripts/release-base.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Exact previous release tag is required; no latest-release fallback is allowed' }
          "base_ref=$baseRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Check Inno Setup 6
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Inno Setup 6 is not installed on this runner' }
          # ISCC 6 does not expose its product major through PE file-version metadata.
          # Its documented help path prints this banner and exits with code 1.
          $PSNativeCommandUseErrorActionPreference = $false
          $helpText = (& $compiler '/?' 2>&1 | Out-String)
          $helpExitCode = $LASTEXITCODE
          if ($helpExitCode -ne 1 -or $helpText -cnotmatch '(?m)^Inno Setup 6 Command-Line Compiler\r?$') {
            Write-Output $helpText
            throw ('Expected Inno Setup 6 compiler; help exit code: ' + $helpExitCode)
          }
          Write-Output 'Verified Inno Setup 6 Command-Line Compiler'
          $global:LASTEXITCODE = 0
      - name: Locked restore, build and all Windows tests
        run: ./scripts/verify.ps1
      - name: Save Windows verification evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/**/TestResults/*.trx
            artifacts/ui/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Build the clean unsigned installer
        run: |
          ./scripts/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $dirty = git status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect source after build' }
          if ($dirty) {
            Write-Output $dirty
            throw 'Build changed source; review the installer build evidence before releasing'
          }
      - name: Collect installer build evidence
        if: always()
        continue-on-error: true
        run: |
          $evidence = Join-Path $PWD 'artifacts/build-verification'
          [IO.Directory]::CreateDirectory($evidence) | Out-Null
          $state = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect source for build evidence' }
          $state | Set-Content -LiteralPath (Join-Path $evidence 'worktree-status.txt') -Encoding utf8NoBOM
          Write-Output $state
          git diff --stat HEAD -- | Tee-Object -FilePath (Join-Path $evidence 'source-diff-stat.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot summarize source changes' }
          git diff --binary HEAD -- | Set-Content -LiteralPath (Join-Path $evidence 'source-changes.patch') -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record source changes' }
          Get-ChildItem 'artifacts/work/*/build-info.json' -ErrorAction SilentlyContinue |
            Copy-Item -Destination $evidence
          if (Test-Path -LiteralPath '.runtime/runtime-manifest.json' -PathType Leaf) {
            Copy-Item -LiteralPath '.runtime/runtime-manifest.json' -Destination (Join-Path $evidence 'bundled-runtime-manifest.json')
          }
      - name: Save installer build evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/build-verification/
          retention-days: 7
          if-no-files-found: warn
      - name: Package matching source, provenance and checksums
        env:
          SLX_BASE_REF: ${{ steps.previous.outputs.base_ref }}
        run: ./scripts/package-source.ps1 -BaseRef $env:SLX_BASE_REF
      - name: Publish immutable prerelease assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs
